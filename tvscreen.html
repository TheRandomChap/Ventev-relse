<!doctype html>
<!-- Dokumentet bruger HTML5 og dansk som sidens sprog. -->
<html lang="da">
<head>
  <!-- Tegnsæt og visningsindstillinger sikrer danske bogstaver og mobilvisning. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <title>Læger på vagt · Venteværelse</title>
  <!-- Style.css styrer sidens udseende. -->
  <link rel="stylesheet" href="Style.css">
  <!-- defer venter med JavaScript, til browseren har læst HTML-indholdet. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
  <script src="doctors.js" defer></script>
  <script src="info-slides.js" defer></script>
  <script src="calls.js" defer></script>
  <script src="Script.js" defer></script>
</head>
<body>
  <main class="screen">
    <!-- Topbjælke med klinikkens logo og markering af live-oversigten. -->
    <header class="topbar">
      <a class="clinic-brand" href="#" aria-label="Lægehuset i Frejlev"><img class="clinic-logo" src="https://xn--lgehusetifrevejle-irbj.dk/wp-content/uploads/sites/739/2024/10/Sk%C3%A6rmbillede-2024-09-17-kl.-13.55.42-1024x335.png" alt="Lægehuset i Frejlev"></a>
      <div class="live-indicator"><span></span> LIVE OVERSIGT</div>
    </header>

    <!-- Hovedområde med velkomst, ur og oversigten over læger. -->
    <div class="content-grid">
      <!-- JavaScript indsætter dato og klokkeslæt i felterne med id date og clock. -->
      <section class="doctor-section" aria-labelledby="doctors-title">
        <div class="section-heading">
          <div>
            <h2 id="doctors-title">Forsinkelser hos lægen</h2>
          </div>
        </div>
        <div class="doctor-list" id="doctor-list" aria-live="polite"></div>
        <p class="doctor-load-message" id="doctor-load-message" role="status" aria-live="polite"></p>
      </section>

      <section class="info-screen" aria-label="Information fra klinikken">
        <img id="info-slide-image" class="info-slide-image" alt="" hidden>
        <div id="info-slide-placeholder" class="info-slide-placeholder">
          <p class="eyebrow">INFORMATION</p>
          <p id="info-slide-message">Henter information…</p>
        </div>
        <p id="info-slide-caption" class="info-slide-caption" hidden></p>
        <div id="info-slide-position" class="info-slide-position" aria-live="polite"></div>
      </section>

      <section class="welcome" aria-labelledby="page-title">
          <section class="clock-panel" aria-label="Aktuel dato og tid">
            <div class="analog-clock" role="img" aria-label="Analogt ur">
              <div class="analog-clock-face">
                <span class="clock-hand hour-hand" id="hour-hand"></span>
                <span class="clock-hand minute-hand" id="minute-hand"></span>
                <span class="clock-hand second-hand" id="second-hand"></span>
                <span class="clock-pin"></span>
              </div>
            </div>
            <div class="date-time">
              <span id="date">—</span>
              <strong id="clock">—</strong>
            </div>
          </section>

          <div class="welcome-copy">
          <p class="eyebrow"></p>
          <h1 id="page-title"><span class="title-dot">.</span></h1>
          <p class="intro"></p>
        </div>
        <div class="info-columns">
          <section id="patient-call-panel" class="patient-call-panel" aria-labelledby="patient-call-title" hidden>
            <p class="eyebrow">INDKALDELSER</p>
            <h2 id="patient-call-title">Kaldt ind</h2>
            <p id="patient-call-status" class="patient-call-status" role="status" aria-live="polite">Henter kald…</p>
            <div id="patient-call-list" class="patient-call-list" aria-live="polite"></div>
          </section>
        </div>
      </section>
    </div>

    <aside class="help-banner" aria-label="Hjælp i receptionen">
      <span class="help-icon" aria-hidden="true">i</span>
      <p><strong>Er du i tvivl?</strong> Henvend dig i receptionen — vi hjælper dig gerne.</p>
      <span class="banner-flower" aria-hidden="true">✳</span>
    </aside>

    <footer><span>Vi passer godt på dig.</span><span class="footer-divider"></span><span>Lægehuset I Fårevejle. <br> Høvevej 17, 4540 Fårevejle. <br> Tlf. 59 65 30 46</span></footer>
  </main>
</body>
</html>
