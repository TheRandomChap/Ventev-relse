<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <title>Log ind · Lægehuset i Fårevejle</title>
  <link rel="stylesheet" href="Style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <img class="auth-logo" src="https://xn--lgehusetifrevejle-irbj.dk/wp-content/uploads/sites/739/2024/10/Sk%C3%A6rmbillede-2024-09-17-kl.-13.55.42-1024x335.png" alt="Lægehuset i Fårevejle">
      <p class="auth-eyebrow">PERSONALEADGANG</p>
      <h1 id="login-title">Log ind</h1>
      <p class="auth-description">Log ind for at åbne klinikkens kontrolpanel.</p>

      <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Adgangskode</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="login-button" type="submit">Log ind</button>
        <p class="auth-message" id="login-message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footnote">Har du ikke en konto? Kontakt klinikkens administrator.</p>
    </section>
  </main>
</body>
</html>
